<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro - Polla Mundial 2026</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: radial-gradient(circle at top right, #1a1a2e, #0f0f1a);
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        /* Esto hace que el texto que escribes dentro sea blanco */
        .form-control {
            background: rgba(255, 255, 255, 0.05) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            color: white !important; 
            padding: 12px;
        }
        .form-control:focus {
            border-color: #ffc107 !important;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <div class="glass-card text-white">
                <h2 class="text-center mb-4">Crear Cuenta</h2>
                
                {% with messages = get_flashed_messages() %}
                  {% if messages %}
                    {% for message in messages %}
                      <div class="alert alert-info">{{ message }}</div>
                    {% endfor %}
                  {% endif %}
                {% endwith %}

                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label text-white">Nombre de usuario</label>
                        <input type="text" name="nombre_usuario" class="form-control" placeholder="Ej: CrackMundial2026" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-white">Correo Corporativo</label>
                        <input type="email" name="correo" class="form-control" placeholder="usuario@empresa.com" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-white">Contraseña</label>
                        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                    </div>

                    <button class="btn btn-success w-100 py-2">REGISTRARSE</button>
                </form>

                <p class="text-center mt-4">
                    ¿Ya tienes cuenta? <a href="/login" class="text-info text-decoration-none">Inicia sesión</a>
                </p>
            </div>
        </div>
    </div>
</div>

</body>
</html>
